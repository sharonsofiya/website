<!-- Modals Component Reference -->
<!-- 1. Project Details Modal -->
<div class="modal fade" id="projectDetailsModal" tabindex="-1" aria-labelledby="projectModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="projectModalTitle">Project Details</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="projectModalBody"></div>
      <div class="modal-footer">
        <a id="projectModalGithubLink" href="#" target="_blank" class="btn btn-outline-secondary">GitHub</a>
        <a id="projectModalLiveLink" href="#" target="_blank" class="btn btn-primary">Live Demo</a>
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
